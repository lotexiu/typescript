name: PR - Analysis

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Real, CI-derived build/test signal — never trust anything committed for this.
      - name: Build
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Test
        id: test
        run: pnpm test
        continue-on-error: true

      - name: Resolve build label
        id: build_label
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "value=build-passed" >> "$GITHUB_OUTPUT"
          else
            echo "value=build-failed" >> "$GITHUB_OUTPUT"
          fi

      # `changes:check` recomputes the same diff from scratch (base = merge-base with
      # master, via a throwaway git worktree, no external clone) and compares it
      # field-by-field against the committed .changes/api-changes.json, ignoring only the
      # generatedAt timestamp — so it only "fails" when something meaningful is actually
      # stale. If it fails (or the file doesn't exist yet), regenerate for real and commit
      # the result back onto the PR branch: nothing here is ever manual, the author never
      # has to run this locally or write a PR description for tags to come out right.
      - name: Regenerate .changes if stale
        run: |
          pnpm run changes:check || pnpm run changes

          git add .changes
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore: update .changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Read computed tags
        id: analysis
        run: |
          TAGS=$(node -p "require('./.changes/api-changes.json').tags.join(',')")
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              { name: 'major', color: 'd73a4a', description: 'Breaking change' },
              { name: 'minor', color: '1d76db', description: 'Backward-compatible feature' },
              { name: 'patch', color: '9aa1a7', description: 'Backward-compatible fix' },
              { name: 'feat', color: '2ea043', description: 'New public export(s) added' },
              { name: 'fix', color: 'fbca04', description: 'Existing export changed (bugfix-shaped)' },
              { name: 'refact', color: '5319e7', description: 'Internal change, public API unchanged' },
              { name: 'docs', color: '0075ca', description: 'Documentation/comments only' },
              { name: 'internal', color: '6f42c1', description: '@internal-only implementation change' },
              { name: 'clean-code', color: 'c5def5', description: 'Manual-only: purely cosmetic, never auto-applied' },
              { name: 'build-passed', color: '2ea043', description: 'Package build + tests passed' },
              { name: 'build-failed', color: 'd73a4a', description: 'Package build or tests failed' },
              { name: 'test', color: 'cfd3d7', description: 'Publish as test/prerelease (manual, optional)' },
            ];

            for (const label of required) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

      - name: Apply computed labels
        uses: actions/github-script@v7
        env:
          TAGS: ${{ steps.analysis.outputs.tags }}
          BUILD_LABEL: ${{ steps.build_label.outputs.value }}
        with:
          script: |
            const tags = process.env.TAGS.split(',').filter(Boolean);
            const buildLabel = process.env.BUILD_LABEL;
            const issue_number = context.issue.number;

            // clean-code is manual-only — never removed or added by this workflow.
            const impactGroup = ['major', 'minor', 'patch'];
            const typeGroup = ['feat', 'fix', 'refact', 'docs', 'internal'];
            const buildGroup = ['build-passed', 'build-failed'];

            for (const label of [...impactGroup, ...typeGroup, ...buildGroup]) {
              try {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const toApply = [...tags.filter((t) => impactGroup.includes(t) || typeGroup.includes(t)), buildLabel];
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: toApply });

      - name: Comment analysis summary
        uses: actions/github-script@v7
        env:
          TAGS: ${{ steps.analysis.outputs.tags }}
          BUILD_LABEL: ${{ steps.build_label.outputs.value }}
        with:
          script: |
            const fs = require('fs');
            const tags = process.env.TAGS.split(',').filter(Boolean);
            const changelog = fs.existsSync('.changes/CHANGELOG.md') ? fs.readFileSync('.changes/CHANGELOG.md', 'utf-8') : '';

            let body = '## PR Analysis\n\n';
            body += `Tags (computed automatically from the API diff, never asked of the author): ${tags.map((t) => `\`${t}\``).join(', ')}\n`;
            body += `Build: \`${process.env.BUILD_LABEL}\` (real \`pnpm build\` + \`pnpm test\` run in this job)\n\n`;
            body += changelog ? `${changelog}\n` : '';
            body += '\n<sub>Generated from `.changes/api-changes.json`, recomputed and verified on every push — nothing here is self-reported.</sub>\n';

            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const marker = '## PR Analysis';
            const existing = comments.find((c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
